name: Nocta
options:
  bundleIdPrefix: com.nocta
  deploymentTarget:
    iOS: "17.0"
targets:
  Nocta:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nocta.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
